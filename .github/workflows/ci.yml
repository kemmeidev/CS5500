name: CampusHub CI

on:
  push:
    branches: [main]
    paths: ["Lab/lab8/**", ".github/**"]
  pull_request:
    branches: [main]
    paths: ["Lab/lab8/**", ".github/**"]

# One run per branch: a newer push cancels the older run, so auto-fix never races itself.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LAB_DIR: Lab/lab8

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab/lab8
    outputs:
      # "failure" only when the Jest step itself failed, not lint or install.
      jest_outcome: ${{ steps.jest.outcome }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Lab/lab8/package-lock.json

      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('Lab/lab8/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Jest test suite
        id: jest
        run: |
          set -o pipefail
          npm test -w campushub-backend 2>&1 | tee "$RUNNER_TEMP/test-results.log"

      - name: Upload Jest log
        if: always() && steps.jest.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results.log
          retention-days: 7

  auto-fix:
    name: Auto-heal failing tests
    needs: test
    # Only when Jest failed on a PR from this repo. Never on pushes to main, never on an
    # auto-heal branch itself, so one broken PR yields at most one fix PR.
    if: >-
      failure() &&
      needs.test.outputs.jest_outcome == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.head_ref, 'fix/auto-heal-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: Lab/lab8
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      FIX_BRANCH: fix/auto-heal-${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Skip if a fix PR is already open for this branch
        id: existing
        run: |
          existing=$(gh pr list --base "$HEAD_REF" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("fix/auto-heal-"))] | length')
          echo "count=$existing" >> "$GITHUB_OUTPUT"
          if [ "$existing" != "0" ]; then
            echo "::notice::An auto-heal PR is already open against $HEAD_REF; not opening another."
          fi

      - name: Set up Node.js
        if: steps.existing.outputs.count == '0'
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: Lab/lab8/package-lock.json

      - name: Cache MongoDB binary (mongodb-memory-server)
        if: steps.existing.outputs.count == '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('Lab/lab8/package-lock.json') }}

      - name: Install dependencies
        if: steps.existing.outputs.count == '0'
        run: npm ci

      - name: Download Jest failure log
        if: steps.existing.outputs.count == '0'
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}

      - name: Build agent context (log + source references + PR diff)
        if: steps.existing.outputs.count == '0'
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/auto-heal-context.sh" \
            "$RUNNER_TEMP/test-results.log" "$BASE_REF" "$RUNNER_TEMP/agent-prompt.md"

      - name: Run Claude Code agent
        if: steps.existing.outputs.count == '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npx -y @anthropic-ai/claude-code@2.1.323 -p \
            --model claude-opus-5-5 \
            --max-turns 40 \
            --output-format json \
            --allowedTools "Read,Grep,Glob,Edit,Bash(npm test:*),Bash(npm run lint:*)" \
            < "$RUNNER_TEMP/agent-prompt.md" > "$RUNNER_TEMP/agent-result.json"
          jq -r '.result // empty' "$RUNNER_TEMP/agent-result.json" > "$RUNNER_TEMP/heal-summary.md"
          jq '{is_error, num_turns, duration_ms, subtype}' "$RUNNER_TEMP/agent-result.json"
          cat "$RUNNER_TEMP/heal-summary.md"

      - name: "Guardrail: patch may only touch non-test source in src/"
        if: steps.existing.outputs.count == '0'
        run: |
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}')
          if [ -z "$changed" ]; then
            echo "::error::The agent produced no changes."
            exit 1
          fi
          echo "Changed files:"; echo "$changed"
          bad=$(echo "$changed" | grep -vE '^Lab/lab8/campushub-backend/src/.+\.ts$' || true)
          bad+=$(echo "$changed" | grep -E '/__tests__/|^Lab/lab8/campushub-backend/src/test/' || true)
          if [ -n "$bad" ]; then
            echo "::error::The agent changed files outside non-test src/: $bad"
            exit 1
          fi

      - name: Verify the patch restores the pipeline
        if: steps.existing.outputs.count == '0'
        run: |
          npm run lint
          npm test -w campushub-backend

      - name: Commit patch and open fix PR
        if: steps.existing.outputs.count == '0'
        run: |
          git config user.name "campushub-auto-heal[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$FIX_BRANCH"
          git add -A -- campushub-backend/src
          git commit -m "fix(backend): auto-heal failing tests from #$PR_NUMBER"
          git push origin "$FIX_BRANCH"

          {
            echo "Automated fix generated by the **auto-fix** job after the Jest suite failed on #$PR_NUMBER (\`$HEAD_REF\`)."
            echo
            echo "- Failing run: $RUN_URL"
            echo "- Base: \`$HEAD_REF\`, so this diff shows only the agent's patch."
            echo "- Before opening this PR, CI checked that only non-test files under \`src/\` changed, and lint and the full Jest suite passed on the patch."
            echo
            echo "## Agent report"
            echo
            cat "$RUNNER_TEMP/heal-summary.md"
            echo
            echo "## Audit Log (human-in-the-loop review)"
            echo
            echo "_To be completed by the reviewer before accepting this patch._"
            echo
            echo "- [ ] Diff touches only source code, no test assertions changed"
            echo "- [ ] Root cause matches the change introduced in #$PR_NUMBER"
            echo "- [ ] Tests re-run locally on this branch"
            echo "- Decision:"
          } > "$RUNNER_TEMP/pr-body.md"

          pr_url=$(gh pr create --base "$HEAD_REF" --head "$FIX_BRANCH" \
            --title "fix(backend): auto-heal failing tests from #$PR_NUMBER" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          echo "Opened $pr_url"
          # Courtesy link only: a failed comment must not fail a job that already opened the PR.
          gh pr comment "$PR_NUMBER" --body "🩹 Tests failed. The auto-fix job proposed a patch: $pr_url" ||
            echo "::warning::Could not comment on #$PR_NUMBER"
